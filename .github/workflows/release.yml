name: release


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 写入版本号（来自 tag）
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "tag 里的版本号不合法：$v" }
          # 不带 BOM 写入，避免解析异常
          [IO.File]::WriteAllText("$PWD\version.txt", $v, (New-Object Text.UTF8Encoding($false)))
          Write-Host "版本 = $v"

      - name: 写入仓库坐标（注入到 BuildInfo.RepoSlug）
        shell: pwsh
        run: |
          [IO.File]::WriteAllText("$PWD\repo.txt", "${{ github.repository }}", (New-Object Text.UTF8Encoding($false)))

      - name: 构建（只编译，不安装、不建快捷方式）
        shell: pwsh
        run: ./build.ps1 -BuildOnly -NoShortcuts

      - name: 生成 SHA-256
        shell: pwsh
        run: |
          $exe = "build\DSH Launcher.exe"
          if (-not (Test-Path $exe)) { throw "没有找到构建产物：$exe" }
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # 内容形式：<hash>  <文件名>，启动器会取第一个 token 校验
          "$h  DSH Launcher.exe" | Set-Content "build\DSH Launcher.exe.sha256" -Encoding ascii
          Write-Host "SHA-256 = $h"
          Get-Item $exe | Select-Object Name, Length | Format-List

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: DSH 启动器 ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            build/DSH Launcher.exe
            build/DSH Launcher.exe.sha256
